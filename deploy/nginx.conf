# Include these locations inside the existing HTTPS server { ... } for your domain.
# Do not replace its other locations, TLS configuration, or server-wide root.

location = /daisy-gci-event-form {
    return 301 /daisy-gci-event-form/$is_args$args;
}

# The trailing slash in proxy_pass removes the public application prefix:
# /daisy-gci-event-form/api/inquiries -> /api/inquiries
location ^~ /daisy-gci-event-form/api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_intercept_errors off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}

# These clean frontend routes serve the same built index as the public form.
location = /daisy-gci-event-form/login {
    root /var/www;
    try_files /daisy-gci-event-form/index.html =404;
}

location = /daisy-gci-event-form/admin {
    root /var/www;
    try_files /daisy-gci-event-form/index.html =404;
}

location = /daisy-gci-event-form/login/ {
    return 301 /daisy-gci-event-form/login$is_args$args;
}

location = /daisy-gci-event-form/admin/ {
    return 301 /daisy-gci-event-form/admin$is_args$args;
}

location ^~ /daisy-gci-event-form/ {
    root /var/www;
    index index.html;
    # Only the explicit routes above use index.html; missing assets stay 404.
    try_files $uri $uri/ =404;
}
